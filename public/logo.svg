  <!-- Texte Guest Manager -->
  <text x="100" y="175" font-family="Playfair Display, Georgia, serif" font-size="18" fill="#1A1A1A" text-anchor="middle" font-weight="600" letter-spacing="2">GUEST MANAGER</text>
