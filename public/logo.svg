  <circle cx="86" cy="96" r="6" fill="none" stroke="#C9A96E" stroke-width="1.2" />
  <!-- Verre à vin droit -->
  <path d="M114 102 L110 112 L118 112 Z" fill="none" stroke="#C9A96E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M114 102 L114 108" fill="none" stroke="#C9A96E" stroke-width="1.2" stroke-linecap="round" />
